<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a session</title>
<meta name="description" content="Book a training session">
<style>
:root{--accent:#1565C0;--bg:#f5f7fb;--card:#fff;--ink:#14161a;--muted:#5d6470;--line:#e2e6ee;--soft:#eaf1fb;--ok:#1b7f3b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eef0f4;--muted:#a3aab6;--line:#2a2f38;--soft:#1d2533}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{padding:28px 0 8px}
.brand{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:28px;line-height:1.15;margin:6px 0 8px}
.intro{color:var(--muted);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.meta a,.meta span{font-size:14px;color:var(--muted);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
h2{font-size:15px;margin:26px 0 10px;display:flex;gap:8px;align-items:center}
h2 .n{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center}
.list{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;color:inherit;font:inherit;cursor:pointer}
.opt.on{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 1px var(--accent) inset}
.opt b{display:block;font-size:17px}
.opt small{color:var(--muted);display:block;margin-top:2px}
.opt a{color:var(--accent);font-weight:600}
.opt .tag{font-size:12px;font-weight:600;color:var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.day{flex:0 0 64px;scroll-snap-align:start;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 0;cursor:pointer;color:inherit;font:inherit}
.day small{display:block;font-size:12px;color:var(--muted)}
.day b{display:block;font-size:20px}
.day.on{border-color:var(--accent);background:var(--accent);color:#fff}.day.on small{color:#fff}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.time{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 0;font:inherit;font-weight:600;color:inherit;cursor:pointer}
.time.on{border-color:var(--accent);background:var(--accent);color:#fff}
.time:disabled{opacity:.4;text-decoration:line-through;cursor:default}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:72px;resize:vertical}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
.sum{font-size:13px;color:var(--muted);margin-bottom:8px;min-height:18px}
.go{width:100%;border:0;border-radius:14px;background:#25D366;color:#073b1c;font:inherit;font-weight:700;font-size:17px;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.go:disabled{background:var(--line);color:var(--muted);cursor:default}
.err{color:#c62828;font-size:13px;margin-top:6px;display:none}
.done{display:none;text-align:center;padding:40px 8px}
.done .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:34px;display:grid;place-items:center;margin:0 auto 12px}
.done button{margin-top:18px;background:none;border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font:inherit;color:inherit}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="brand" id="brand"></div>
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>
    <div class="meta" id="meta"></div>
  </header>

  <section id="form">
    <h2><span class="n">1</span>Session</h2>
    <div class="list" id="sessions"></div>

    <div id="whereBox" style="display:none">
      <h2><span class="n">2</span>Where</h2>
      <div class="list" id="where"></div>
    </div>

    <h2><span class="n" id="nDay">2</span>Day</h2>
    <div class="days" id="days"></div>

    <h2><span class="n" id="nTime">3</span>Time</h2>
    <div class="times" id="times"></div>

    <h2><span class="n" id="nMe">4</span>Your details</h2>
    <label for="name">Name</label>
    <input id="name" autocomplete="name" placeholder="First and last name">
    <label for="phone">WhatsApp number</label>
    <input id="phone" type="tel" autocomplete="tel" placeholder="e.g. 246 555 1234">
    <label for="ig">Instagram (optional)</label>
    <input id="ig" placeholder="@yourhandle" autocapitalize="off">
    <label for="notes">Anything I should know? (optional)</label>
    <textarea id="notes" placeholder="Goals, injuries, first time..."></textarea>
    <footer id="foot"></footer>
  </section>

  <section class="done" id="done">
    <div class="tick">✓</div>
    <h1 style="font-size:22px">Almost there</h1>
    <p class="intro">WhatsApp should have opened with your booking. Press send there, and I'll confirm your spot.</p>
    <button onclick="again()">Book another session</button>
  </section>
</div>

<div class="bar" id="bar"><div class="in">
  <div class="sum" id="sum">Pick a session, day and time.</div>
  <button class="go" id="go" disabled onclick="send()">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2s.2-1.1.1-1.2-.2-.2-.4-.3z"/></svg>
    Request on WhatsApp
  </button>
  <div class="err" id="err"></div>
</div></div>

<script>
window.BOOKING_CONFIG = {"brand": "ONEALS FIIT", "title": "Book a session", "intro": "Pick a session, a place and a time, then send it to me on WhatsApp. I'll confirm your spot.", "whatsapp": "12462591572", "instagram": "", "location": "", "accent": "#E31B23", "daysAhead": 14, "currency": "$", "sessions": [{"id": "pt", "name": "Personal Training", "business": "ONEALS FIIT", "minutes": 60, "price": 0, "capacity": 1, "days": [1, 2, 3, 4, 5, 6], "times": [300, 360, 420, 960, 1020, 1080], "description": "1-on-1 session, plan built around your goals."}, {"id": "group", "name": "Group Class", "business": "Shredded Academy", "minutes": 60, "price": 0, "capacity": 12, "days": [1, 3, 5], "times": [330, 1050], "description": "High energy group workout. All levels welcome."}], "locations": [{"id": "bl-six-roads", "name": "Beyond Limits - Six Roads", "address": "Six Roads, St. Philip, Barbados", "map": "https://www.google.com/maps/search/?api=1&query=Beyond+Limits+Gym+Six+Roads+Barbados", "waze": "https://waze.com/ul?q=Beyond+Limits+Six+Roads%2C+Six+Roads%2C+St.+Philip%2C+Barbados&navigate=yes"}, {"id": "bl-wildey", "name": "Beyond Limits - Wildey", "address": "Wildey, St. Michael, Barbados", "map": "https://www.google.com/maps/search/?api=1&query=Beyond+Limits+Gym+Wildey+Barbados", "waze": "https://waze.com/ul?q=Beyond+Limits+Wildey%2C+Wildey%2C+St.+Michael%2C+Barbados&navigate=yes"}, {"id": "bl-sheraton", "name": "Beyond Limits - Sheraton", "address": "Sheraton Centre, Christ Church, Barbados", "map": "https://www.google.com/maps/search/?api=1&query=Beyond+Limits+Gym+Sheraton+Barbados", "waze": "https://waze.com/ul?q=Beyond+Limits+Sheraton%2C+Sheraton+Centre%2C+Christ+Church%2C+Barbados&navigate=yes"}, {"id": "bl-speightstown", "name": "Beyond Limits - Speightstown", "address": "Speightstown, St. Peter, Barbados", "map": "https://www.google.com/maps/search/?api=1&query=Beyond+Limits+Gym+Speightstown+Barbados", "waze": "https://waze.com/ul?q=Beyond+Limits+Speightstown%2C+Speightstown%2C+St.+Peter%2C+Barbados&navigate=yes"}, {"id": "bl-hastings", "name": "Beyond Limits - Hastings", "address": "Hastings, Christ Church, Barbados", "map": "https://www.google.com/maps/search/?api=1&query=Beyond+Limits+Gym+Hastings+Barbados", "waze": "https://waze.com/ul?q=Beyond+Limits+Hastings%2C+Hastings%2C+Christ+Church%2C+Barbados&navigate=yes"}, {"id": "bl-gibbons", "name": "Beyond Limits - Gibbons", "address": "Gibbons, Christ Church, Barbados", "map": "https://www.google.com/maps/search/?api=1&query=Beyond+Limits+Gym+Gibbons+Barbados", "waze": "https://waze.com/ul?q=Beyond+Limits+Gibbons%2C+Gibbons%2C+Christ+Church%2C+Barbados&navigate=yes"}, {"id": "bl-canewood", "name": "Beyond Limits - Canewood", "address": "Canewood, St. Michael, Barbados", "map": "https://www.google.com/maps/search/?api=1&query=Beyond+Limits+Gym+Canewood+Barbados", "waze": "https://waze.com/ul?q=Beyond+Limits+Canewood%2C+Canewood%2C+St.+Michael%2C+Barbados&navigate=yes"}, {"id": "other", "name": "Other", "address": "", "map": "", "waze": ""}], "full": [], "made": "2026-11-08"};
const C = window.BOOKING_CONFIG;
const $ = id => document.getElementById(id);
const DAYN = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let S = { session: null, day: null, time: null, place: null };
const PLACES = C.locations || [];

const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const wd = d => (d.getDay() + 6) % 7 + 1;            // 1 = Monday
const tl = m => { const h = Math.floor(m / 60), h12 = h % 12 || 12; return h12 + ":" + pad(m % 60) + (h < 12 ? " AM" : " PM"); };
const longDay = d => DAYN[wd(d) - 1] + " " + d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = v => v > 0 ? (C.currency || "$") + (v % 1 ? v.toFixed(2) : v) : "";
const full = (sid, date, t) => (C.full || []).some(f => f.s === sid && f.d === date && f.t === t);

function header() {
  document.title = C.title + " · " + C.brand;
  document.documentElement.style.setProperty("--accent", C.accent || "#1565C0");
  $("brand").textContent = C.brand;
  $("title").textContent = C.title;
  $("intro").textContent = C.intro;
  const m = [];
  if (C.location) m.push("<span>📍 " + esc(C.location) + "</span>");
  if (C.instagram) m.push('<a href="https://instagram.com/' + encodeURIComponent(C.instagram.replace(/^@/, "")) + '">📸 ' + esc(C.instagram) + "</a>");
  $("meta").innerHTML = m.join("");
  $("foot").textContent = "Your request goes to " + C.brand + " on WhatsApp. Nothing is stored on this page.";
}

function sessions() {
  const box = $("sessions");
  box.innerHTML = "";
  C.sessions.forEach(s => {
    const b = document.createElement("button");
    b.className = "opt" + (S.session && S.session.id === s.id ? " on" : "");
    const bits = [s.minutes + " min", money(s.price), s.capacity > 1 ? "group, up to " + s.capacity : "1-on-1"].filter(Boolean).join(" · ");
    b.innerHTML = (s.business ? '<span class="tag">' + esc(s.business) + "</span>" : "") + "<b>" + esc(s.name) + "</b><small>" + esc(bits) + "</small>" + (s.description ? "<small>" + esc(s.description) + "</small>" : "");
    b.onclick = () => { S.session = s; S.day = null; S.time = null; render(); };
    box.appendChild(b);
  });
  if (C.sessions.length === 1 && !S.session) { S.session = C.sessions[0]; }
}

function places() {
  if (!PLACES.length) return;
  $("whereBox").style.display = ""; $("nDay").textContent = "3"; $("nTime").textContent = "4"; $("nMe").textContent = "5";
  if (PLACES.length === 1) S.place = PLACES[0];
  const box = $("where"); box.innerHTML = "";
  PLACES.forEach(l => {
    const b = document.createElement("button");
    b.className = "opt" + (S.place && S.place.id === l.id ? " on" : "");
    b.innerHTML = "<b>📍 " + esc(l.name || l.address) + "</b>" + (l.address && l.name ? "<small>" + esc(l.address) + "</small>" : "") +
      (l.map ? '<small><a href="' + esc(l.map) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">Google Maps</a>' +
        (l.waze ? ' · <a href="' + esc(l.waze) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">Waze</a>' : "") + "</small>" : "<small>Tell me where in the notes below</small>");
    b.onclick = () => { S.place = l; render(); };
    box.appendChild(b);
  });
}

function openDays(s) {
  const out = [], now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  for (let i = 0; i < (C.daysAhead || 14); i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (!s.days.includes(wd(d))) continue;
    if (times(s, d).some(t => !t.off)) out.push(d);
  }
  return out;
}

function times(s, d) {
  const now = new Date(), isToday = ymd(d) === ymd(now), nowMin = now.getHours() * 60 + now.getMinutes() + 60;
  return s.times.filter(t => !isToday || t >= nowMin).map(t => ({ t, off: full(s.id, ymd(d), t) }));
}

function render() {
  sessions();
  places();
  const days = $("days"), tbox = $("times");
  days.innerHTML = ""; tbox.innerHTML = "";
  if (!S.session) { days.innerHTML = '<div class="empty">Pick a session first.</div>'; }
  else {
    const list = openDays(S.session);
    if (!list.length) days.innerHTML = '<div class="empty">No open days right now. Message me on WhatsApp.</div>';
    list.forEach(d => {
      const b = document.createElement("button");
      b.className = "day" + (S.day && ymd(S.day) === ymd(d) ? " on" : "");
      b.innerHTML = "<small>" + DAYN[wd(d) - 1] + "</small><b>" + d.getDate() + "</b><small>" + MON[d.getMonth()] + "</small>";
      b.onclick = () => { S.day = d; S.time = null; render(); };
      days.appendChild(b);
    });
    if (!S.day) tbox.innerHTML = '<div class="empty">Pick a day.</div>';
    else times(S.session, S.day).forEach(x => {
      const b = document.createElement("button");
      b.className = "time" + (S.time === x.t ? " on" : "");
      b.textContent = tl(x.t);
      b.disabled = x.off;
      if (x.off) b.title = "Full";
      b.onclick = () => { S.time = x.t; render(); };
      tbox.appendChild(b);
    });
  }
  const ready = S.session && S.day && S.time != null && (!PLACES.length || S.place);
  $("sum").textContent = ready ? S.session.name + " · " + longDay(S.day) + " · " + tl(S.time) + (S.place ? " · " + (S.place.name || S.place.address) : "")
    : (PLACES.length ? "Pick a session, place, day and time." : "Pick a session, day and time.");
  $("go").disabled = !ready;
}

function ref() { const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let r = ""; for (let i = 0; i < 5; i++) r += a[Math.floor(Math.random() * a.length)]; return r; }

function send() {
  const name = $("name").value.trim(), phone = $("phone").value.trim(), ig = $("ig").value.trim(), notes = $("notes").value.trim();
  const err = $("err");
  if (!name || phone.replace(/\D/g, "").length < 7) { err.textContent = "Please add your name and WhatsApp number."; err.style.display = "block"; ($("name").value ? $("phone") : $("name")).focus(); return; }
  err.style.display = "none";
  try { localStorage.setItem("bk_me", JSON.stringify({ name, phone, ig })); } catch (e) {}
  const lines = [
    "📅 Booking request",
    "Ref: " + ref(),
    "Session: " + S.session.name + " (" + S.session.minutes + " min)",
    "Date: " + longDay(S.day) + " (" + ymd(S.day) + ")",
    "Time: " + tl(S.time),
    ...(S.place ? ["Location: " + (S.place.name || S.place.address)] : []),
    "Name: " + name,
    "Phone: " + phone,
  ];
  if (ig) lines.push("Instagram: " + (ig.startsWith("@") ? ig : "@" + ig));
  if (notes) lines.push("Notes: " + notes.replace(/\n+/g, " "));
  const url = "https://wa.me/" + String(C.whatsapp).replace(/\D/g, "") + "?text=" + encodeURIComponent(lines.join("\n"));
  $("form").style.display = "none"; $("bar").style.display = "none"; $("done").style.display = "block";
  window.scrollTo(0, 0);
  location.href = url;
}

function again() { S = { session: C.sessions.length === 1 ? C.sessions[0] : null, day: null, time: null, place: null }; $("form").style.display = ""; $("bar").style.display = ""; $("done").style.display = "none"; render(); }

(function init() {
  header();
  try { const me = JSON.parse(localStorage.getItem("bk_me") || "null"); if (me) { $("name").value = me.name || ""; $("phone").value = me.phone || ""; $("ig").value = me.ig || ""; } } catch (e) {}
  const want = new URLSearchParams(location.search).get("s");
  if (want) S.session = C.sessions.find(s => s.id === want || s.name.toLowerCase().includes(want.toLowerCase())) || null;
  render();
})();
</script>
</body>
</html>
